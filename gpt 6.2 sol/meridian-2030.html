<style>

@media(max-width:700px){header{padding:13px 12px}.brand{letter-spacing:.1em;font-size:11px;gap:5px}.brand svg{width:24px;height:24px}.clock{display:none}.tool{padding:8px 6px;font-size:10px}.intro{left:18px;bottom:17vh;max-width:89vw}.intro h1{font-size:clamp(62px,15vw,100px)}.intro p{max-width:290px}.mapbox{width:124px;right:12px;bottom:16px}body:not(.play) .mapbox{display:none}#status{left:15px;bottom:18px;font-size:9px;letter-spacing:0}#loc{top:73px;left:14px}#loc strong{font-size:19px}#bearing{top:70px;left:auto;right:13px;transform:none}#toast{right:12px;top:123px}#prompt{bottom:34%;white-space:normal}.dialog-inner{padding:20px}}

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('world'), gl = canvas.getContext('webgl', {alpha:false, antialias:true, powerPreference:'high-performance'});
const rad = Math.PI / 180, TAU = Math.PI * 2;
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
const lerp = (a,b,t) => a+(b-a)*t;
let seed = 2030;
function rnd(){ seed = (Math.imul(1664525,seed)+1013904223)>>>0; return seed/4294967296; }
function color(hex){return [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255);}
const scale = (c,k) => c.map(x=>x*k);
const pick = xs => xs[Math.floor(rnd()*xs.length)];
const landmarks = [
  {name:'South Lookout',x:0,z:-125,y:6,view:[0,28,-132,0,-.065],type:'Observation deck',entry:'At extreme high tide, the water reaches the second set of marks on the pier. The lower walkways are built to flood, while the rail and market stay open above them.'},
  {name:'Tidal Commons',x:-132,z:15,y:6,view:[-132,12,-7,0,0],type:'Living shoreline',entry:'These terraces used to be a car park. They hold rainwater on the way down to the bay. Beyond the footpaths, the planted edges are left alone through nesting season.'},
  {name:'Silkline Exchange',x:0,z:48,y:7,view:[0,10,26,0,.02],type:'Transit hub',entry:'The harbor line runs above the projected flood level. At night the same tracks bring groceries and repair parts into the city, straight to the district lockers.'},
  {name:'Helios Spire',x:0,z:137,y:12,view:[0,14,113,0,.24],type:'Energy cooperative',entry:'The Spire stores surplus energy from the harbor. During an outage its batteries serve cooling rooms, the water pumps and a public lift to the roof garden.'},
  {name:'Kelpworks',x:149,z:96,y:7,view:[149,12,72,0,.01],type:'Offshore farm',entry:'The floating squares move with the tide. Each holds seed lines for kelp. Small electric tenders bring the harvest to the shore for food, fertilizer and materials research.'}
];
let visited = new Set();
try {const saved=JSON.parse(localStorage.getItem('meridian2030.log')||'[]');if(Array.isArray(saved))visited=new Set(saved.filter(i=>Number.isInteger(i)&&landmarks[i]));} catch {}
const slots = [
  {name:'DUSK',clock:'18:24', sun:[.15,.13,.98],sky:[.155,.42,.54],horizon:[.91,.62,.44],fog:[.58,.61,.54],light:[1.29,1.09,.91],night:.17},
  {name:'NIGHT',clock:'22:10', sun:[-.58,.145,.80],sky:[.025,.058,.14],horizon:[.23,.32,.49],fog:[.13,.22,.33],light:[.42,.58,.86],night:1},
  {name:'DAWN',clock:'06:12', sun:[.63,.15,.76],sky:[.35,.58,.69],horizon:[.98,.72,.57],fog:[.77,.73,.64],light:[1.23,1.1,1.02],night:.1},
  {name:'DAY',clock:'12:40', sun:[-.49,.67,.51],sky:[.20,.52,.73],horizon:[.74,.86,.87],fog:[.67,.78,.78],light:[1.13,1.19,1.19],night:0}
];
let timeSlot=0, env=structuredClone(slots[0]);
const pos={x:118,y:54,z:-165,yaw:-.46,pitch:-.105}, keys=new Set();
let started=false, flying=true, riding=false, target=-1, near=-1, toastTimer, drag=null, audio=null;
let vx=0,vy=0,vz=0;
const land=[], solid=[], plan=[];
let mesh=[];
function point(p,c,m){mesh.push(p[0],p[1],p[2],c[0],c[1],c[2],m);}
function tri(a,b,c,t,m=0){point(a,t,m);point(b,t,m);point(c,t,m);}
function quad(a,b,c,d,t,m=0){tri(a,b,c,t,m);tri(a,c,d,t,m);}
function box(x,y,z,w,h,d,c,mat=0,wall=mat){
  const a=x-w/2,b=x+w/2,n=z-d/2,s=z+d/2,t=y+h;
  quad([a,t,n],[a,t,s],[b,t,s],[b,t,n],scale(c,1.12),mat);
  quad([a,y,n],[a,t,n],[b,t,n],[b,y,n],scale(c,.88),wall);
  quad([b,y,s],[b,t,s],[a,t,s],[a,y,s],scale(c,.61),wall);
  quad([a,y,s],[a,t,s],[a,t,n],[a,y,n],scale(c,1.04),wall);
  quad([b,y,n],[b,t,n],[b,t,s],[b,y,s],scale(c,.68),wall);
  quad([a,y,n],[b,y,n],[b,y,s],[a,y,s],scale(c,.5),mat);
}
function prism(x,y,z,r,h,rt,c,n=8,angle=0,mat=0){
  for(let i=0;i<n;i++){
    const a=angle+i*TAU/n,b=a+TAU/n;
    const p=[x+Math.cos(a)*r,y,z+Math.sin(a)*r],q=[x+Math.cos(b)*r,y,z+Math.sin(b)*r];
    const u=[x+Math.cos(a)*rt,y+h,z+Math.sin(a)*rt],v=[x+Math.cos(b)*rt,y+h,z+Math.sin(b)*rt];
    quad(p,q,v,u,scale(c,.73+.26*Math.cos(a+2.1)),mat);
    tri([x,y+h,z],u,v,scale(c,1.13),mat);
  }
}
function beam(a,b,width,c,mat=0){
  const dx=b[0]-a[0],dz=b[2]-a[2], length=Math.hypot(dx,dz)||1;
  const ix=-dz/length*width/2, iz=dx/length*width/2;
  const side=(p,s,h)=>[p[0]+ix*s,p[1]+h,p[2]+iz*s];
  quad(side(a,-1,0),side(a,1,0),side(b,1,0),side(b,-1,0),c,mat);
  const drop=-width*.52;
  quad(side(a,-1,0),side(a,-1,drop),side(b,-1,drop),side(b,-1,0),scale(c,.58),mat);
  quad(side(a,1,0),side(a,1,drop),side(b,1,drop),side(b,1,0),scale(c,.8),mat);
}
const stone=color('849389'), deck=color('b5b4a0'), road=color('364952'), rail=color('b9cab9'), glow=color('b9ffcd'), amber=color('ffc37b');
function platform(x,z,w,d,h,c=stone){
  box(x,-2,z,w,h+2,d,c);
  land.push({x,z,w,d,h});
  box(x,h-.43,z,w+.4,.22,d+.4,scale(c,.62));
}
function border(x,z,w,d,y,c){
  box(x,y,z-d/2,w,.22,.25,c);box(x,y,z+d/2,w,.22,.25,c);
  box(x-w/2,y,z,.25,.22,d,c);box(x+w/2,y,z,.25,.22,d,c);
}
function tree(x,y,z,h=4){
  const c=pick([color('558358'),color('418264'),color('72924f'),color('3d6e5b')]);
  prism(x,y,z,h*.058,h*.72,h*.035,color('5c4d3a'),5);
  prism(x,y+h*.49,z,h*.28,h*.36,h*.18,c,7,rnd());
  prism(x+.14,y+h*.85,z,h*.18,h*.25,.02,scale(c,1.13),7,rnd());
}
function lamp(x,y,z,h=4){
  box(x,y,z,.12,h,.12,rail); box(x+.26,y+h,z,.7,.10,.25,glow,2);
}
function parkbed(x,y,z,w,d){
  box(x,y,z,w,.44,d,deck);
  box(x,y+.44,z,w-.4,.07,d-.4,color('537d62'));
  for(let i=0;i<6;i++) tree(x+(rnd()-.5)*(w-1),y+.5,z+(rnd()-.5)*(d-1),2+rnd()*3);
}
function street(x,z,w,d){
  box(x,4.01,z,w,.025,d,road);
  const vertical=d>w, len=vertical?d:w;
  for(let k=-len/2+4;k<len/2-3;k+=7){
    box(x+(vertical?0:k),4.05,z+(vertical?k:0),vertical?.11:2.9,.012,vertical?2.9:.11,scale(amber,.75));
  }
}
function building(x,z,w,d,h,style){
  const y=4;
  const concrete=pick(['abbaad','bcc4af','93aaa4','bfb3a0','a4b9b4'].map(color));
  const glass=pick(['4c797e','456575','598787','426e72','638683'].map(color));
  box(x,y,z,w+1,.32,d+1,color('798d82'));
  if(style===0){
    box(x,y+.32,z,w,h,d,glass,0,1);
    box(x,y+h+.32,z,w+.6,.45,d+.6,concrete);
    for(let i=1;i<=6;i++){
      const f=i/7-.5;
      box(x+w*f,y+.4,z-d/2-.1,.12,h,.22,concrete);
      box(x+w*f,y+.4,z+d/2+.1,.12,h,.22,concrete);
    }
  } else if(style===1){
    const base=h*.57;
    box(x,y+.32,z,w,base,d,concrete,0,1);
    box(x+.65,y+.32+base,z,w+.6,.35,d+.7,deck);
    box(x+1.15,y+.67+base,z,w*.70,h-base,d*.73,glass,0,1);
    tree(x-w*.33,y+.71+base,z+d*.36,2.1);
  } else {
    box(x,y+.32,z,w,h,d,concrete,0,1);
    for(let i=5.7;i<h-1;i+=5.7){
      box(x,y+i,z,w+.7,.22,d+.7,scale(concrete,.93));
    }
    box(x,y+h+.33,z,w+.45,.3,d+.45,deck);
  }
  border(x,z,w*.62,d*.62,y+h+.74,color('63796e'));
  box(x,y+h+.62,z,w*.31,1.1,d*.25,scale(concrete,.8));
  if(style===1&&h>20){
    box(x-w*.19,y+h+.65,z-d*.17,w*.28,.19,d*.46,color('6f9164'));
    tree(x-w*.19,y+h+.84,z-d*.15,1.75);
  } else if(style===0&&h>24)solar(x,y+h+.67,z+d*.16,w*.54,1.8);
  if(h>29)box(x,y+h+.72,z+d*.27,w*.55,.13,.26,glow,2);
  solid.push({x,z,w: w+.15,d:d+.15,h:y+h+.75});plan.push({x,z,w,d});
}
function bridge(x,z,w,d,y=4){
  platform(x,z,w,d,y,deck);
  const along=d>w;
  for(const sign of [-1,1]){
    const xx=x+sign*(along?w/2-.3:0),zz=z+sign*(along?0:d/2-.3);
    box(xx,y+.75,zz,along?.17:w,.12,along?d:.17,rail);
    for(let k=-(along?d:w)/2+2;k<(along?d:w)/2;k+=4.8)
      box(xx+(along?0:k),y,zz+(along?k:0),.11,.84,.11,rail);
  }
}
function solar(x,y,z,w=4,d=2.6){
  box(x,y,z-.5,.12,1.15,.12,rail);box(x,y,z+.5,.12,.7,.12,rail);
  const a=x-w/2,b=x+w/2,n=z-d/2,s=z+d/2;
  quad([a,y+1.31,n],[a,y+.67,s],[b,y+.67,s],[b,y+1.31,n],color('295674'),4);
  beam([a,y+1.33,n],[b,y+1.33,n],.07,rail);
}
function construct(){
  // Continuous ground and street grid on the main harbor island.
  platform(0,59,170,310,4,stone);
  for(let x=-72;x<=72;x+=36)street(x,59,8.4,300);
  for(let z=-83;z<=202;z+=36)street(0,z,164,7.4);
  for(let x=-54;x<=54;x+=36)for(let z=-65;z<205;z+=36){
    if((z>=7&&z<=79&&Math.abs(x)<20)||(z>=115&&z<=151&&Math.abs(x)<20))continue;
    for(const dx of [-6.1,6.1])for(const dz of [-6.5,6.5]){
      const height=6+rnd()*12+Math.max(0,1-Math.abs(x)/79)*(6+rnd()*30)+(z>26&&z<174?rnd()*23:0);
      if((x===-18&&dx>0)||rnd()<.15)parkbed(x+dx,4.08,z+dz,9,10);
      else building(x+dx,z+dz,7+rnd()*3,7+rnd()*4,height,Math.floor(rnd()*3));
    }

  for(let j=0;j<3;j++)for(let i=0;i<4;i++)rect(188+i*16,72+j*21,10,14);
  m.strokeStyle='#b9f9bc90';m.setLineDash([3,2]);m.beginPath();
  m.moveTo(mapX(-9.8),mapZ(-66));m.lineTo(mapX(-9.8),mapZ(210));m.stroke();
}
function refreshMap(){
  ctx.drawImage(mapLayer,0,0);
  if(target>=0){
    const l=landmarks[target];ctx.strokeStyle='#d4ff9ab8';ctx.setLineDash([3,4]);ctx.beginPath();
    ctx.moveTo(mapX(pos.x),mapZ(pos.z));ctx.lineTo(mapX(l.x),mapZ(l.z));ctx.stroke();ctx.setLineDash([]);
  }
  for(const [i,l] of landmarks.entries()){
    ctx.save();ctx.translate(mapX(l.x),mapZ(l.z));ctx.rotate(Math.PI/4);
    ctx.lineWidth=1;ctx.strokeStyle=i===target?'#dbffa9':'#e5f2d8';ctx.strokeRect(-3.3,-3.3,6.6,6.6);
    if(visited.has(i)||target===i){ctx.fillStyle='#c9ff9d';ctx.fillRect(-2,-2,4,4);}ctx.restore();
  }
  ctx.save();ctx.translate(clamp(mapX(pos.x),5,map.width-5),clamp(mapZ(pos.z),6,map.height-6));ctx.rotate(pos.yaw);
  ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(4,4);ctx.lineTo(0,2);ctx.lineTo(-4,4);ctx.closePath();
  ctx.fillStyle='#fff2cb';ctx.shadowColor='#092426';ctx.shadowBlur=5;ctx.fill();ctx.restore();
}
function say(message){
  $('toast').textContent=message;$('toast').hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200);
}
function uiCount(){$('surveys').textContent=visited.size+' / '+landmarks.length+' LOGGED';}
function zeroMotion(){vx=vy=vz=0;keys.clear();}
function enter(){
  if(started||!scene)return;
  if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
  started=true;document.body.classList.add('play');$('intro').hidden=true;
  for(const id of ['bearing','loc','cross'])$(id).hidden=false;
  if(target<0)target=0;
  say(matchMedia('(pointer:coarse)').matches?'Drag to look · use the arrows to move':'WASD to move · drag to look · M for atlas');
}
function showPanel(tag,title){
  if(document.pointerLockElement===canvas)document.exitPointerLock();
  zeroMotion();drag=null;
  $('panelTag').textContent=tag;$('panelTitle').textContent=title;
  $('panelBody').replaceChildren();if(!panel.open)panel.showModal();
  return $('panelBody');
}
function paragraph(parent,text){
  const p=document.createElement('p');p.textContent=text;parent.append(p);
}
function routeTo(i){
  if(!scene){paragraph(showPanel('District · '+landmarks[i].type,landmarks[i].name),landmarks[i].entry);return;}
  if(panel.open)panel.close();
  enter();zeroMotion();
  [pos.x,pos.y,pos.z,pos.yaw,pos.pitch]=landmarks[i].view;
  flying=true;riding=false;target=i;say('Arrived at '+landmarks[i].name);
}
function atlas(){
  const body=showPanel('District atlas','Meridian Bay');
  paragraph(body,'Jump to a district overlook, then follow the diamond to read its field note. Tap a diamond on the minimap to track it from where you are.');
  const routes=document.createElement('div');routes.className='routes';
  landmarks.forEach((l,i)=>{
    const button=document.createElement('button');button.className='route';
    const num=document.createElement('span');num.className='num';num.textContent=visited.has(i)?'✓':'0'+(i+1);
    const type=document.createElement('small');type.textContent=l.type+' ↗';
    button.append(num,document.createTextNode(l.name),type);routes.append(button);
    button.onclick=()=>routeTo(i);
  });body.append(routes);
}
function help(){
  const body=showPanel('Explorer controls','Find your way');
  paragraph(body,'Fly anywhere around the bay or descend to the streets and cross the bridges on foot. The atlas takes you to any district.');
  const grid=document.createElement('div');grid.className='controls';
  const touch=matchMedia('(pointer:coarse)').matches;
  for(const [action,binding] of [
    ['Move',touch?'Arrow pad':'W A S D / ↑ ↓'],
    ['Look',touch?'Drag':'Drag / ← → / PgUp PgDn'],
    ['Capture mouse',touch?'':'L · Esc to release'],
    ['Rise / descend',touch?'＋ / −':'Space / C'],
    ['Boost','Shift'],['Switch flight or walk',touch?'Mode label':'F'],['Read nearby field note',touch?'Tap prompt':'E'],
    ['Open atlas','M'],['Cycle daylight','T']
  ]){
    if(touch&&(action==='Boost'||action==='Capture mouse'))continue;
    const word=document.createElement('span'),key=document.createElement('kbd');
    word.textContent=action;key.textContent=binding;grid.append(word,key);
  }
  body.append(grid);
}
function readNote(i){
  if(i<0)return;
  const l=landmarks[i];visited.add(i);
  try{localStorage.setItem('meridian2030.log',JSON.stringify([...visited]));}catch{}
  uiCount();if(target===i)target=-1;
  paragraph(showPanel('Field note · '+l.type,l.name),l.entry);
  if(i===2){
    const ride=document.createElement('button');ride.className='primary';ride.textContent='Ride the Silkline ↗';
    ride.onclick=()=>{
      panel.close();zeroMotion();riding=true;flying=true;target=-1;
      pos.yaw=trainPose(clockTime).direction>0?0:Math.PI;pos.pitch=-.07;
      say('Silkline observation car · F to exit');
    };
    $('panelBody').append(ride);
  }
  if(visited.size===landmarks.length)paragraph($('panelBody'),'All five districts logged. The bay is yours to explore.');
}
function surface(x,z){
  let h=-Infinity;
  for(const p of land)if(Math.abs(x-p.x)<=p.w/2&&Math.abs(z-p.z)<=p.d/2)h=Math.max(h,p.h);
  return h;
}
function blocked(x,y,z){
  return solid.some(b=>Math.abs(x-b.x)<b.w/2+.38&&Math.abs(z-b.z)<b.d/2+.38&&y<b.h+.36);
}
function toggleMode(){
  enter();
  if(riding){riding=false;pos.y+=1.3;zeroMotion();say('Flight mode');return;}
  if(!flying){flying=true;pos.y+=.8;say('Flight mode');return;}
  const h=surface(pos.x,pos.z);
  if(!Number.isFinite(h)||blocked(pos.x,h+1.73,pos.z)){
    say('Fly over a street, bridge or clear deck to land.');return;
  }
  flying=false;pos.y=h+1.73;vy=0;say('Walking mode');
}
function cycleLight(){
  timeSlot=(timeSlot+1)%slots.length;
  $('light').textContent=slots[timeSlot].name;$('clock').textContent=slots[timeSlot].clock+' LOCAL';
}
async function toggleSound(){
  try{
    if(!audio){
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio){say('Audio is unavailable in this browser.');return;}
      audio=new Audio();
      const output=audio.createGain();output.gain.value=.14;output.connect(audio.destination);
      const waves=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=waves.getChannelData(0);
      let smooth=0;
      for(let i=0;i<data.length;i++){smooth=(smooth+(Math.random()*2-1)*.021)/1.021;data[i]=smooth*2.35;}
      const source=audio.createBufferSource();source.buffer=waves;source.loop=true;
      const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=440;
      source.connect(filter);filter.connect(output);source.start();
      const swell=audio.createOscillator(),w=audio.createGain();swell.frequency.value=.13;w.gain.value=130;
      swell.connect(w);w.connect(filter.frequency);swell.start();
      for(const [hz,gain] of [[55,.032],[82.41,.021],[110,.009]]){
        const note=audio.createOscillator(),level=audio.createGain();level.gain.value=gain;note.frequency.value=hz;
        note.connect(level);level.connect(output);note.start();
      }
      await audio.resume();
    }else if(audio.state==='running')await audio.suspend();
    else await audio.resume();
    const active=audio.state==='running';$('sound').textContent=active?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',String(active));
  }catch{say('Audio is unavailable in this browser.');}
}
$('enter').onclick=enter;$('atlasIntro').onclick=atlas;$('atlas').onclick=atlas;$('help').onclick=help;
$('light').onclick=cycleLight;$('sound').onclick=toggleSound;$('close').onclick=()=>panel.close();
$('prompt').onclick=()=>readNote(near);
map.addEventListener('click',e=>{
  const bounds=map.getBoundingClientRect(),x=(e.clientX-bounds.left)*map.width/bounds.width,y=(e.clientY-bounds.top)*map.height/bounds.height;
  const i=landmarks.findIndex(l=>Math.hypot(x-mapX(l.x),y-mapZ(l.z))<14);
  if(i<0){atlas();return;}
  enter();target=target===i?-1:i;if(target>=0)say('Tracking '+landmarks[i].name);
});
const modeButton=$('mode');modeButton.onclick=toggleMode;modeButton.title='Switch flight or walk (F)';
const moving=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyC','ShiftLeft','ShiftRight','PageUp','PageDown']);
window.addEventListener('keydown',e=>{
  if(panel.open||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'&&e.target instanceof HTMLButtonElement)return;
  if(moving.has(e.code)){
    if(!started)return;
    keys.add(e.code);e.preventDefault();return;
  }
  if(e.repeat)return;
  if(e.code==='KeyM'){e.preventDefault();atlas();}
  else if(e.code==='KeyT')cycleLight();
  else if(e.key==='?')help();
  else if(e.code==='KeyF'&&started)toggleMode();
  else if(e.code==='KeyE'&&started)readNote(near);
  else if(e.code==='KeyL'&&started){
    if(document.pointerLockElement===canvas)document.exitPointerLock();
    else try{canvas.requestPointerLock()?.catch(()=>say('Use drag to look.'));}catch{say('Use drag to look.');}
  }
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',zeroMotion);
document.addEventListener('visibilitychange',()=>{if(document.hidden)zeroMotion();});
document.addEventListener('pointerlockerror',()=>say('Use drag to look.'));
function look(dx,dy){
  pos.yaw=(pos.yaw+dx*.004)%TAU;pos.pitch=clamp(pos.pitch-dy*.004,-1.47,1.47);
}
canvas.addEventListener('pointerdown',e=>{
  if(!started||panel.open||e.button!==0)return;
  if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';
});
document.addEventListener('pointermove',e=>{
  if(!started||panel.open)return;
  if(document.pointerLockElement===canvas){look(e.movementX,e.movementY);return;}
  if(drag&&drag.id===e.pointerId){look(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;}
});
function clearDrag(e){if(drag?.id===e.pointerId){drag=null;canvas.style.cursor='grab';}}
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,clearDrag);
for(const key of document.querySelectorAll('[data-key]')){
  key.addEventListener('pointerdown',e=>{e.preventDefault();key.setPointerCapture(e.pointerId);keys.add(key.dataset.key);});
  for(const type of ['pointerup','pointercancel','lostpointercapture'])key.addEventListener(type,()=>keys.delete(key.dataset.key));
}
function movement(dt){
  const held=(...codes)=>codes.some(c=>keys.has(c));
  pos.yaw+=dt*1.48*(Number(held('ArrowRight'))-Number(held('ArrowLeft')));
  pos.pitch=clamp(pos.pitch+dt*(Number(held('PageUp'))-Number(held('PageDown'))),-1.47,1.47);
  let fw=Number(held('KeyW','ArrowUp'))-Number(held('KeyS','ArrowDown'));
  let st=Number(held('KeyD'))-Number(held('KeyA'));
  const mag=Math.max(1,Math.hypot(fw,st));fw/=mag;st/=mag;
  const speed=(flying?22:7.8)*(held('ShiftLeft','ShiftRight')?2.55:1);
  const ease=1-Math.exp(-dt*(flying?6.2:13));
  vx=lerp(vx,(Math.sin(pos.yaw)*fw+Math.cos(pos.yaw)*st)*speed,ease);
  vz=lerp(vz,(Math.cos(pos.yaw)*fw-Math.sin(pos.yaw)*st)*speed,ease);
  const rise=Number(held('Space'))-Number(held('KeyC'));
  vy=lerp(vy,flying?rise*speed*.8:0,ease);
  const moveAxis=(axis,change)=>{
    const x=axis==='x'?clamp(pos.x+change,-490,520):pos.x;
    const z=axis==='z'?clamp(pos.z+change,-388,435):pos.z;
    const h=surface(x,z);
    const y=flying?pos.y:h+1.73;
    if(!flying&&(!Number.isFinite(h)||h>pos.y-.63))return;
    if(flying&&pos.y<h+.45)return;
    if(blocked(x,y,z))return;
    pos.x=x;pos.z=z;
    if(!flying)pos.y=y;
  };
  moveAxis('x',vx*dt);moveAxis('z',vz*dt);
  if(flying){
    const y=clamp(pos.y+vy*dt,Math.max(1,surface(pos.x,pos.z)+.47),186);
    if(!blocked(pos.x,y,pos.z))pos.y=y;
  }
}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function dist(l){return Math.hypot(pos.x-l.x,pos.y-l.y,pos.z-l.z);}
function updateUI(cam){
  $('altitude').textContent=Math.round(pos.y)+' M';
  if(!started)return;
  modeButton.hidden=false;modeButton.textContent=riding?'EXIT SILKLINE [F]':flying?'FLIGHT [F]':'WALK [F]';
  const degrees=(Math.round(pos.yaw/rad)%360+360)%360;
  $('bearing').textContent=['N','NE','E','SE','S','SW','W','NW'][Math.round(degrees/45)%8]+' '+String(degrees).padStart(3,'0')+'°';
  const closest=landmarks.reduce((last,l,i)=>dist(l)<dist(landmarks[last])?i:last,0);
  $('zone').textContent=dist(landmarks[closest])<66?landmarks[closest].name:'Meridian Bay';
  const bearing=target>=0?Math.atan2(landmarks[target].x-pos.x,landmarks[target].z-pos.z)-pos.yaw:0;
  const directions=['↑','↗','→','↘','↓','↙','←','↖'];
  const arrow=directions[(Math.round(bearing/(TAU/8))%8+8)%8];
  $('hint').textContent=target>=0?arrow+' WAYPOINT '+Math.round(dist(landmarks[target]))+' M':matchMedia('(pointer:coarse)').matches?'DRAG TO LOOK':'WASD MOVE · M ATLAS';
  near=!riding&&dist(landmarks[closest])<18?closest:-1;
  $('prompt').hidden=near<0||panel.open;
  if(near>=0)$('prompt').textContent='[ E ]  Read field note · '+landmarks[near].name;
  const id=target>=0?target:near;
  const marker=$('marker');marker.hidden=true;
  if(id>=0&&!panel.open){
    const l=landmarks[id],v=[l.x-pos.x,l.y+4-pos.y,l.z-pos.z],w=dot(v,cam.forward);
    if(w>2){
      const x=dot(v,cam.right)*cam.lens[0]/w,y=dot(v,cam.up)*cam.lens[1]/w;
      if(Math.abs(x)<.92&&Math.abs(y)<.77){
        marker.hidden=false;marker.style.left=((1+x)*50)+'%';marker.style.top=((1-y)*50)+'%';
        marker.textContent=l.name.toUpperCase()+' · '+Math.round(dist(l))+' M';
      }
    }
  }
}
let previous=0, clockTime=0, lastRefresh=-1;
function frame(now){
  const dt=previous?Math.min(.045,(now-previous)/1000):0;previous=now;clockTime+=dt;
  if(started&&!panel.open){
    if(riding){
      const train=trainPose(clockTime);
      pos.x=-10.82;pos.y=13.2;pos.z=train.z;
      pos.yaw+=dt*1.48*(Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')));
    }else movement(dt);
  }
  const goal=slots[timeSlot], ease=1-Math.exp(-dt*2.3);
  for(const k of ['sun','sky','horizon','fog','light'])env[k]=env[k].map((x,i)=>lerp(x,goal[k][i],ease));
  env.night=lerp(env.night,goal.night,ease);
  const cam=camera();render(clockTime,cam);
  if(clockTime-lastRefresh>.07){lastRefresh=clockTime;updateUI(cam);refreshMap();}
  requestAnimationFrame(frame);
}
try{
  if(!gl)throw Error('WebGL is unavailable');
  setup();buildMap();uiCount();canvas.style.cursor='grab';requestAnimationFrame(frame);
}catch(error){
  console.error(error);$('enter').disabled=true;
  $('intro').querySelector('p').textContent='Meridian’s 3D view needs WebGL. You can still open the atlas to browse its districts.';
  for(const button of [$('light'),$('sound')])button.disabled=true;
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();say('The 3D renderer was interrupted.');});
canvas.addEventListener('webglcontextrestored',()=>{
  land.length=solid.length=plan.length=0;seed=2030;setup();buildMap();say('3D view restored.');
});
</script>
</body>
